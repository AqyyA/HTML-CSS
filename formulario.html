<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato — Alan Silva</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1>Formulário de Contato</h1>
    <p>Preencha os campos abaixo para entrar em contato comigo.</p>

    <nav aria-label="Navegação principal">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="curriculo.html">Currículo</a></li>
            <li><a href="multimidia.html">Multimídia</a></li>
        </ul>
    </nav>

    <form action="#" method="post">
        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome completo:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required><br><br>

            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 91234-5678"><br><br>

            <label for="nascimento">Data de nascimento:</label><br>
            <input type="date" id="nascimento" name="nascimento"><br><br>
        </fieldset>

        <fieldset>
            <legend>Assunto</legend>

            <label for="assunto">Motivo do contato:</label><br>
            <select id="assunto" name="assunto">
                <option value="duvida">Dúvida</option>
                <option value="proposta">Proposta de trabalho</option>
                <option value="feedback">Feedback</option>
                <option value="outro">Outro</option>
            </select><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40" placeholder="Escreva sua mensagem aqui"></textarea><br><br>

            <p>Prefere ser contatado por:</p>
            <input type="radio" id="contato-email" name="preferencia" value="email" checked>
            <label for="contato-email">E-mail</label><br>
            <input type="radio" id="contato-telefone" name="preferencia" value="telefone">
            <label for="contato-telefone">Telefone</label><br><br>

            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Desejo receber novidades por e-mail</label><br><br>
        </fieldset>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
